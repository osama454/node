<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Specifies character encoding for the HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Sets viewport to make it responsive -->
    <title>Repositionable Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="modal"> <!-- Main modal container -->
      <h2 id="modalTitle">Select a direction</h2> <!-- Title displayed inside the modal -->
      <select id="directionDropdown"> <!-- Dropdown for direction selection -->
        <option value="">-- Select --</option>
        <option value="up">Up</option>
        <option value="down">Down</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </div>
    <script src="script.js"></script>
</body>
</html>
