<!DOCTYPE html>
<html>
  <head>
    <title>Word Game</title>
    <!-- Updated title for the game -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Word Game</h1>
    <!-- Updated heading for the game -->

    <div id="currentPlayer">Player 1's Turn</div>
    <!-- Displays the current player’s turn -->

    <div id="gameArea">
      <div class="player" id="player1">
        <h2>Player 1</h2>
        <!-- Player 1's section header -->
        <div id="player1Score">Score: 0</div>
        <!-- Player 1's score display -->
        <div id="player1Turns">Turns Left: 3</div>
        <!-- Turns left for Player 1 -->
        <button onclick="startGame(1)">Generate Number</button>
        <!-- Button to generate a random number -->
        <div id="player1Number"></div>
        <!-- Display area for generated number -->
        <input type="text" id="player1Word" placeholder="Enter word" />
        <!-- Input field for Player 1's word -->
        <button onclick="checkWord(1)">Submit</button>
        <!-- Button to submit the entered word -->
        <div id="player1UsedLetters">Used Letters:</div>
        <!-- Displays letters used by Player 1 -->
        <div id="player1Result"></div>
        <!-- Displays feedback for Player 1 -->
      </div>

      <div class="player" id="player2">
        <h2>Player 2</h2>
        <!-- Player 2's section header -->
        <div id="player2Score">Score: 0</div>
        <!-- Player 2's score display -->
        <div id="player2Turns">Turns Left: 3</div>
        <!-- Turns left for Player 2 -->
        <button onclick="startGame(2)">Generate Number</button>
        <!-- Button to generate a random number for Player 2 -->
        <div id="player2Number"></div>
        <!-- Display area for generated number for Player 2 -->
        <input type="text" id="player2Word" placeholder="Enter word" />
        <!-- Input field for Player 2's word -->
        <button onclick="checkWord(2)">Submit</button>
        <!-- Button to submit the entered word for Player 2 -->
        <div id="player2UsedLetters">Used Letters:</div>
        <!-- Displays letters used by Player 2 -->
        <div id="player2Result"></div>
        <!-- Displays feedback for Player 2 -->
      </div>
    </div>

    <div id="timer">10</div>
    <!-- Timer display -->

    <script src="script.js"></script>
  </body>
</html>
