<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Person's Network</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
      .node {
        fill: #1f77b4;
      }
      .label {
        font-family: Arial, sans-serif;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <svg width="600" height="400"></svg>
    <div>
      <input id="new-person" type="text" placeholder="Name" />
      <button id="add-person">Add Person</button>
    </div>
    <div>
      <select id="source-person"></select>
      <select id="target-person"></select>
      <button id="add-relation">Add Relation</button>
    </div>
    <script>
      // Select the SVG area and set the dimensions
      const svg = d3.select("svg");
      const width = +svg.attr("width");
      const height = +svg.attr("height");

      // Define the data structure for nodes and links
      const data = {
        nodes: [
          { id: "Alice" },
          { id: "Bob" },
          { id: "Charlie" },
          { id: "Diana" },
        ],
        links: [
          { source: "Alice", target: "Bob" },
          { source: "Alice", target: "Charlie" },
          { source: "Bob", target: "Diana" },
          { source: "Diana", target: "Charlie" },
        ],
      };

      // Initialize the simulation with forces
      const simulation = d3
        .forceSimulation(data.nodes)
        .force(
          "link",
          d3
            .forceLink(data.links)
            .id((d) => d.id)
            .distance(100)
        )
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width / 2, height / 2));

      // Create links, nodes, and labels and append them to the SVG
      let link = svg
        .append("g")
        .selectAll("line")
        .data(data.links)
        .enter()
        .append("line")
        .attr("stroke", "#999")
        .attr("stroke-width", 1.5);

      let node = svg
        .append("g")
        .selectAll("circle")
        .data(data.nodes)
        .enter()
        .append("circle")
        .attr("r", 8)
        .attr("class", "node");

      let label = svg
        .append("g")
        .selectAll("text")
        .data(data.nodes)
        .enter()
        .append("text")
        .attr("class", "label")
        .text((d) => d.id);

      // Function to update graphical elements during simulation tick
      function ticked() {
        link
          .attr("x1", (d) => d.source.x)
          .attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x)
          .attr("y2", (d) => d.target.y);

        node.attr("cx", (d) => d.x).attr("cy", (d) => d.y);

        label.attr("x", (d) => d.x + 10).attr("y", (d) => d.y + 5);
      }

      simulation.on("tick", ticked);

      // Update dropdowns for selecting source and target persons
      function updatePersonSelects() {
        const sourcePersonSelect = document.getElementById("source-person");
        const targetPersonSelect = document.getElementById("target-person");
        sourcePersonSelect.innerHTML = "";
        targetPersonSelect.innerHTML = "";
        data.nodes.forEach((node) => {
          const option = document.createElement("option");
          option.value = node.id;
          option.text = node.id;
          sourcePersonSelect.appendChild(option);
          targetPersonSelect.appendChild(option.cloneNode(true));
        });
      }

      updatePersonSelects();

      // Event listener to add a new person
      document.getElementById("add-person").addEventListener("click", () => {
        const newPerson = document.getElementById("new-person").value.trim();
        if (newPerson && !data.nodes.some((n) => n.id === newPerson)) {
          data.nodes.push({ id: newPerson });
          updatePersonSelects();
          document.getElementById("new-person").value = "";
          restartSimulation();
        }
      });

      // Event listener to add a new relation
      document.getElementById("add-relation").addEventListener("click", () => {
        const sourcePerson = document.getElementById("source-person").value;
        const targetPerson = document.getElementById("target-person").value;
        if (sourcePerson && targetPerson && sourcePerson !== targetPerson) {
          const existingRelation = data.links.find((link) => {
            return (
              (link.source.id === sourcePerson &&
                link.target.id === targetPerson) ||
              (link.source.id === targetPerson &&
                link.target.id === sourcePerson)
            );
          });
          if (!existingRelation) {
            data.links.push({ source: sourcePerson, target: targetPerson });
            restartSimulation();
          } else {
            alert("This relation already exists.");
          }
        }
      });

      // Function to restart the simulation with updated data
      function restartSimulation() {
        simulation.stop();

        // Update the data bindings for links, nodes, and labels
        link = link.data(data.links);
        link.exit().remove();
        link = link
          .enter()
          .append("line")
          .merge(link)
          .attr("stroke", "#999")
          .attr("stroke-width", 1.5);

        node = node.data(data.nodes);
        node.exit().remove();
        node = node
          .enter()
          .append("circle")
          .merge(node)
          .attr("r", 8)
          .attr("class", "node");

        label = label.data(data.nodes);
        label.exit().remove();
        label = label
          .enter()
          .append("text")
          .merge(label)
          .attr("class", "label")
          .text((d) => d.id);

        // Restart the simulation with updated forces
        simulation.nodes(data.nodes);
        simulation.force("link").links(data.links);
        simulation.alpha(1).restart();
        simulation.on("tick", ticked);
      }
    </script>
  </body>
</html>
