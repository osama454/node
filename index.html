<!DOCTYPE html>
<html>
<head>
<title>Number and Word Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Number and Word Game</h1>

  <div id="game-info">
    <p>Player <span id="current-player">1</span>'s turn</p>
    <p>Turns remaining: <span id="turns-left">3</span></p>
    <p id="timer">Time left: 10</p>
  </div>

  <button id="generate-number">Generate Number</button>
  <p id="number-display"></p>

  <input type="text" id="word-input" placeholder="Enter word">
  <button id="submit-word">Submit Word</button>

  <p id="message"></p>
  <p id="used-letters">Used letters: </p>

  <div id="player1-score">Player 1 score: 0</div>
  <div id="player2-score">Player 2 score: 0</div>

  <script src="script.js"></script>
</body>
</html>
